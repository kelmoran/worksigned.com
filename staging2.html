<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- IBM Plex Sans: match the index front page. Self-hosted from assets/fonts/ (same dir) -->
<style>
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 400; font-display: swap;
    src: url("assets/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 500; font-display: swap;
    src: url("assets/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 600; font-display: swap;
    src: url("assets/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-style: normal; font-weight: 700; font-display: swap;
    src: url("assets/fonts/ibm-plex-sans-latin-700-normal.woff2") format("woff2"); }
</style>
<title>How WorkSigned creates resilient proofs of research work.</title>
<script>
// Theme: dark by default. A standalone render can force light with ?theme=light
// (used by render_video.py to produce hashflow-light.mp4). When embedded, the
// parent page can set data-theme on <html> directly; this also honors a
// matching attribute already present.
(function(){
    try {
        var m = /[?&]theme=light\b/.test(location.search) ||
                /[?&]theme=dark\b/.test(location.search);
        if (/[?&]theme=light\b/.test(location.search)) document.documentElement.setAttribute('data-theme','light');
        else if (/[?&]theme=dark\b/.test(location.search)) document.documentElement.setAttribute('data-theme','dark');
    } catch(e) {}
})();
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #0a0e17; color: #e2e8f0; font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    padding: 24px;
    min-height: 100%;
}
body > * { max-width: 800px; }
.stageWrap { max-width: 800px; }
h1 { max-width: 800px; width: 100%; text-align: center; margin-bottom: 4px; }
h1 { font-size: 22px; font-weight: 600; color: #f1f5f9; }
.stage {
    position: relative;
    width: 100%;
    max-width: 800px;
    height: 460px;
    background: radial-gradient(120% 90% at 50% 0%, #182433 0%, #0f1420 62%);
    border: 1px solid #263243;
    border-radius: 14px;
    overflow: hidden;
}
.zoomable {
    position: absolute;
    inset: 0;
    will-change: transform;
}
/* Caption lives in a top-level overlay OUTSIDE the stage (a sibling of it,
   inside .stageWrap), so the zoom (which scales only #zoomable) can never
   scale, clip, or obscure it. It is anchored to .stageWrap so it centers on
   the same 800px column as the stage at any viewport width. */
#capOverlay {
    position: absolute;
    left: 0; right: 0;
    top: 100%;            /* just below the stage (stage is the first child) */
    margin-top: 18px;
    min-height: 56px;
    z-index: 50;
    pointer-events: none;
    display: flex;
    justify-content: center;
    padding: 0 24px;
}
.caption {
    max-width: 800px;
    text-align: center;
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.2px;
    color: #eef2f7;
    text-shadow: 0 1px 8px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.6);
    opacity: 0;
}
/* Light-mode toggle, pinned top-right (always visible, outside the zoom layer). */
.theme-toggle {
    position: fixed; top: 16px; right: 18px; z-index: 100;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; line-height: 1; cursor: pointer;
    color: #e2e8f0; background: rgba(20,28,44,0.72);
    border: 1px solid rgba(103,232,249,0.35);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    transition: background .18s, color .18s, border-color .18s;
}
.theme-toggle:hover { background: rgba(34,211,238,0.18); }
/* All motion is driven by GSAP (top/left/width/height/opacity/scaleY).
   No CSS transitions here — a single GSAP clock owns every property, so the
   transition-race bugs the hand-rolled version had are gone by construction. */
.box {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: 10px;
    opacity: 0;
    backdrop-filter: blur(2px);
}
.cat {
    border: 1.5px solid rgba(74,158,255,0.7);
    background: linear-gradient(180deg, rgba(74,158,255,0.14), rgba(74,158,255,0.05));
    color: #93c5fd;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 14px;
    font-weight: 500;
}
.hash {
    border: 1.5px solid rgba(52,211,153,0.7);
    background: linear-gradient(180deg, rgba(52,211,153,0.14), rgba(52,211,153,0.05));
    color: #6ee7b7;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 13px;
}
/* arrow: a thin vertical bar, drawn downward by GSAP animating scaleY
   (transform-origin: top center). The tip is a CSS triangle that fades in. */
.arrow {
    position: absolute;
    width: 2px;
    background: #7c8aa0;
    height: 0;   /* drawn downward by GSAP animating height; tip tracks the bottom edge */
}
.arrow .tip {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 12px solid #7c8aa0;
    opacity: 0;   /* hidden until the arrow starts growing (GSAP fades it in) */
}
.rootHash {
    border: 2px solid rgba(245,158,11,0.85);
    background: linear-gradient(180deg, rgba(245,158,11,0.17), rgba(245,158,11,0.06));
    color: #fcd34d;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    box-shadow: 0 0 24px rgba(245,158,11,0.32);
}
.ctx {
    border: 1.5px solid rgba(129,140,248,0.7);
    background: linear-gradient(180deg, rgba(129,140,248,0.15), rgba(129,140,248,0.05));
    color: #c7d2fe;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.35;
    padding: 0 10px;
}
.record {
    border: 2px solid rgba(34,211,238,0.85);
    background: linear-gradient(180deg, rgba(34,211,238,0.17), rgba(34,211,238,0.06));
    color: #a5f3fc;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    box-shadow: 0 0 24px rgba(34,211,238,0.32);
}
/* step 10: the chain-of-daily-signatures timeline */
#tl-line {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg, transparent, #22d3ee 15%, #22d3ee 85%, transparent);
    opacity: 0;
    z-index: 2;
}
.tlnode {
    position: absolute;
    border-radius: 50%;
    border: 2px solid #22d3ee;
    background: #0e141b;   /* solid (page bg) so the timeline line doesn't show through */
    opacity: 0;
    z-index: 3;
}
.tlnode .date {
    position: absolute;
    top: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #67e8f9;
    white-space: nowrap;
}
/* SVG layer holding the 5 curved convergence lines (step 5). Sits behind the
   boxes but inside the zoomable so it scales with the zoom. */
#converge, #converge2 {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
}
#converge path, #converge2 path {
    fill: none;
    stroke: #7c8aa0;
    stroke-width: 2;
    stroke-linecap: round;
}
#converge2 path {
    stroke: #22d3ee;
    stroke-opacity: 0.55;
}
/* controls */
.controls { display: flex; gap: 10px; }
.btn {
    background: #1e293b;
    color: #cbd5e1;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 7px 16px;
    font-size: 13px;
    cursor: pointer;
}
.btn:hover { background: #334155; }
.btn:disabled { opacity: .35; cursor: default; }

/* ---- zoom layer: chat-transcript cards revealed when zooming into the
     'full transcripts' card. Absolutely positioned, fades in on top. ---- */
.stageWrap {
    position: relative;
    width: 100%; max-width: 800px; margin: 0 auto;
    margin-bottom: 74px;   /* reserve the caption's height so the block (stage+caption) centers */
}
#chatLayer {
    position: absolute; inset: 0;
    opacity: 0; visibility: hidden;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 28px;
    padding: 40px;
    box-sizing: border-box;
    pointer-events: none;
    z-index: 20;
    border-radius: 12px;
    overflow: hidden;
    background: #0f1420;
}
.chatCard {
    background: #0b1220;
    border: 1px solid #1e3a5f;
    border-radius: 12px;
    padding: 14px;
    display: flex; flex-direction: column;
    gap: 9px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    overflow: hidden;
}
.chatCard .chatHead {
    font-size: 12px; color: #38bdf8; font-family: monospace;
    border-bottom: 1px solid #1e3a5f; padding-bottom: 7px; margin-bottom: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bubble {
    height: 13px; border-radius: 8px;
    background: #1e293b;
    width: 62%;
    align-self: flex-start;
}
.bubble.r {
    align-self: flex-end;
    background: #14532d;
}
.bubble.s {
    width: 40%;
}
#zoomBtn {
    display: none;
    margin-left: auto;
}

/* ============================================================
   LIGHT THEME
   Same geometry/animation, flipped palette for a light page.
   Scoped to [data-theme="light"] so the dark path is untouched.
   Glows (box-shadow glows) become soft shadows; neon text becomes
   darker same-hue text for contrast on white.
   ============================================================ */
[data-theme="light"] html,
[data-theme="light"] body { background: #f4f6fa; color: #0f172a; }
[data-theme="light"] h1 { color: #0f172a; }
[data-theme="light"] .stage {
    background: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #eaeff7 62%);
    border: 1px solid #d5dce8;
}
[data-theme="light"] .caption {
    color: #1e293b;
    text-shadow: 0 1px 6px rgba(255,255,255,0.9), 0 0 2px rgba(255,255,255,0.7);
}
[data-theme="light"] .cat {
    border: 1.5px solid #2563eb;
    background: linear-gradient(180deg, rgba(37,99,235,0.10), rgba(37,99,235,0.04));
    color: #1d4ed8;
}
[data-theme="light"] .hash {
    border: 1.5px solid #059669;
    background: linear-gradient(180deg, rgba(5,150,105,0.10), rgba(5,150,105,0.04));
    color: #047857;
}
[data-theme="light"] .arrow { background: #64748b; }
[data-theme="light"] .arrow .tip { border-top-color: #64748b; }
[data-theme="light"] .rootHash {
    border: 2px solid #d97706;
    background: linear-gradient(180deg, rgba(217,119,6,0.13), rgba(217,119,6,0.05));
    color: #b45309;
    box-shadow: 0 4px 18px rgba(217,119,6,0.22);
}
[data-theme="light"] .ctx {
    border: 1.5px solid #4f46e5;
    background: linear-gradient(180deg, rgba(79,70,229,0.10), rgba(79,70,229,0.04));
    color: #4338ca;
}
[data-theme="light"] .record {
    border: 2px solid #0891b2;
    background: linear-gradient(180deg, rgba(8,145,178,0.13), rgba(8,145,178,0.05));
    color: #0e7490;
    box-shadow: 0 4px 18px rgba(8,145,178,0.22);
}
[data-theme="light"] #tl-line {
    background: linear-gradient(90deg, transparent, #0891b2 15%, #0891b2 85%, transparent);
}
[data-theme="light"] .tlnode {
    border: 2px solid #0891b2;
    background: #f4f6fa;   /* page bg so the line doesn't show through */
}
[data-theme="light"] .tlnode .date { color: #0e7490; }
[data-theme="light"] #converge path, [data-theme="light"] #converge2 path {
    stroke: #64748b;
}
[data-theme="light"] #converge2 path {
    stroke: #0891b2;
    stroke-opacity: 0.5;
}
[data-theme="light"] .btn {
    background: #ffffff; color: #334155; border: 1px solid #cbd5e1;
}
[data-theme="light"] .btn:hover { background: #eef2f8; }
[data-theme="light"] #chatLayer {
    background: #eef2f8;
    border-radius: 12px;
}
[data-theme="light"] .chatCard {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    box-shadow: 0 8px 24px rgba(15,23,42,.12);
}
[data-theme="light"] .chatCard .chatHead {
    color: #0369a1;
    border-bottom: 1px solid #cbd5e1;
}
[data-theme="light"] .bubble { background: #e2e8f0; }
[data-theme="light"] .bubble.r { background: #bbf7d0; }
</style>
</head>
<body>
<div class="stageWrap">
    <div class="stage" id="stage" role="img" aria-label="Work categories move up, arrows draw down, and what gets fingerprinted drops in at center">
        <div class="zoomable" id="zoomable">
            <svg id="converge" aria-hidden="true"></svg>
            <svg id="converge2" aria-hidden="true"></svg>
        </div>
    </div>
    <div id="chatLayer" aria-hidden="true">
        <div class="chatCard"><div class="chatHead">chat &mdash; 09:14</div><div class="bubble"></div><div class="bubble r"></div><div class="bubble s"></div><div class="bubble r s"></div></div>
        <div class="chatCard"><div class="chatHead">chat &mdash; 11:02</div><div class="bubble r"></div><div class="bubble s"></div><div class="bubble"></div><div class="bubble r"></div></div>
        <div class="chatCard"><div class="chatHead">chat &mdash; 14:37</div><div class="bubble"></div><div class="bubble r s"></div><div class="bubble s"></div><div class="bubble r"></div></div>
        <div class="chatCard"><div class="chatHead">chat &mdash; 16:51</div><div class="bubble r s"></div><div class="bubble"></div><div class="bubble r"></div><div class="bubble s"></div></div>
    </div>
    <div id="capOverlay" role="status" aria-live="polite">
        <div class="caption" id="capEl">Your work, as it changed today</div>
    </div>
</div>
<script src="vendor/gsap.min.js"></script>
<script>
(function(){
    var stage = document.getElementById('stage');
    // inner layer that holds the boxes/arrows; the ZOOM scales only this, so the
    // stage keeps its fixed 800x460 frame (overflow hidden) and the page is
    // never scaled or pushed around.
    var zoomable = document.getElementById('zoomable');
    var stepEl = document.getElementById('stepEl');
    var capEl = document.getElementById('capEl');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    var replayBtn = document.getElementById('replayBtn');
    var zoomBtn = document.getElementById('zoomBtn');
    // No UI buttons in the video build. The vars fall back to a no-op proxy so
    // every `btn.disabled = / .style / .textContent / .innerHTML` write is a
    // harmless no-op (the elements are absent); addEventListener calls are
    // guarded below.
    var _noop = { disabled:false, textContent:'', innerHTML:'', style:{}, addEventListener:function(){} };
    prevBtn = prevBtn || _noop;
    nextBtn = nextBtn || _noop;
    replayBtn = replayBtn || _noop;
    zoomBtn = zoomBtn || _noop;
    var chatLayer = document.getElementById('chatLayer');

    // ---- Caption track (independent of the scene, but on the same clock) ----
    // Captions are explicit timed tweens on the master timeline, NOT fired by
    // scene .call()s. Each caption fades in at its anchor label and stays until
    // the next caption replaces it. This disassociates caption *screen time*
    // from the scene logic: a caption's duration is a number we set, so one
    // can't flash for <1s just because a scene beat clobbered it.
    function showCaption(text, fadeIn){
        capEl.textContent = text;
        gsap.killTweensOf(capEl);
        gsap.fromTo(capEl, { opacity: 0, y: 5 },
            { opacity: 1, y: 0, duration: (fadeIn || 0.9), ease: 'power1.out' });
    }
    // add a caption to the timeline at anchorLabel. If text is null, no tween.
    function addCaption(tl, anchorLabel, text, fadeIn){
        if (text == null || text === '') return;   // blank steps add no caption
        tl.call(function(){ showCaption(text, fadeIn); }, null, anchorLabel);
    }

    // ---- Zoom segment (inlined onto the master timeline, between s3 and s4) ----
    // Scales #zoomable about the center of the 'full transcripts' card (hash2)
    // and fades the chat-transcript layer in on top. Driven by the master tl so
    // it stays in sync with the captions and is seek-safe on rebuild.
    function addZoomSegment(tl, anchorLabel){
        var W = stage.clientWidth, H = stage.clientHeight;
        // hash2 is at its step-3 position (top: G.hashY) when the zoom fires.
        var ox = ((G.hashX[2] + G.hashW / 2) / W) * 100;
        var oy = ((G.hashY + G.BOX_H / 2) / H) * 100;
        // RESOLVE the anchor to a NUMBER. (Using the label string in `a + 0.4`
        // would do string concatenation -> 's3+=0.30.4' -> all tweens collapse
        // onto the anchor. Numeric offsets keep the zoom-in/out staggered.)
        var a = tl.labels['s3'] + 0.3;
        var T = 2.6;
        var zoomIn = 0.9, hold = 2.2, zoomOut = 0.9;
        // ZOOM IN
        tl.to(zoomable, { scale: T, transformOrigin: ox + '% ' + oy + '%',
            duration: zoomIn, ease: 'power2.inOut' }, a);
        tl.to('.box, .arrow', { opacity: 0.06, duration: 0.5 }, a + 0.4);
        tl.to(chatLayer, { autoAlpha: 1, duration: 0.5, ease: 'power1.out' }, a + 0.7);
        // transcript caption: fade in near the end of the zoom-in, hold through
        // the fully-visible window (this is the caption that takes step 3's time)
        addCaption(tl, a + 0.5, 'Full AI transcripts are recorded: this clarifies the role AI took in your research.', 0.6);
        // hold, then ZOOM OUT (restores the flow for step 4)
        tl.to({}, { duration: hold }, a + zoomIn + 0.5);
        tl.to(chatLayer, { autoAlpha: 0, duration: 0.4 }, a + zoomIn + 0.5 + hold);
        tl.to(zoomable, { scale: 1, duration: zoomOut, ease: 'power2.inOut' }, a + zoomIn + 0.5 + hold);
        tl.to('.box, .arrow', { opacity: 1, duration: 0.5 }, a + zoomIn + 0.5 + hold + 0.3);
        // total span of the segment (callers add a label after this)
        return zoomIn + 0.5 + hold + zoomOut + 0.3;
    }

    // Only the key beats carry a caption (HASHFLOW3's narrative). The rest are
    // blank so the animation can breathe between the important lines. (Step 3
    // is intentionally blank: the zoom's transcript caption takes that time.)
    var CAPTIONS = [
        'Your research day is recorded: files, database views, AI chats, searches, and email.',              // 1
        'Each item produces a digital fingerprint.',                                                          // 2
        '',                                                                                                  // 3: (the zoom's transcript caption takes this time)
        '',                                                                                                  // 4: (merged into 5; the row-shift beat is short)
        'All individual fingerprints are combined into a single daily fingerprint.',                         // 5
        'One fingerprint now provides proof for everything done during that day.',                           // 6
        'A digital package is assembled that includes the researcher\u2019s identity, project identity, time, and the prior day\u2019s fingerprint.', // 7
        'WorkSigned signs this package and attests to its contents - adding it to the daily research record. This proves the work existed.', // 8
        'The signature process only involves the fingerprint and not the actual data, keeping things private and in the researcher\u2019s control.', // 9
        'All research records are digitally chained and anchors to trusted timestamps. This creates a timeline that proves the work was done at this time and in this order.' // 10
    ];
    var N = 10;         // total steps (UI / counting)
    var CATS = [
        ['databases', 'views and new data'],
        ['files', 'edits and changes'],
        ['AI chats', 'full transcripts'],
        ['web search', 'query log'],
        ['email', 'sent and received']
    ];

    var nodes = {};
    function mk(id, cls, html, arrow){
        var el = document.createElement('div');
        el.className = arrow ? 'arrow' : 'box ' + cls;
        if (arrow) el.innerHTML = '<div class="tip"></div>';
        else if (html) el.innerHTML = html;
        zoomable.appendChild(el);
        var rec = { el: el, arrow: !!arrow };
        if (arrow) rec.tip = el.querySelector('.tip');
        nodes[id] = rec;
    }
    var i;
    for (i = 0; i < 5; i++){
        mk('cat' + i, 'cat', CATS[i][0]);
        mk('hash' + i, 'hash', CATS[i][1]);
        mk('arrow' + i, null, null, true);
    }
    mk('rootHash', 'rootHash', '&#9632; DAILY FINGERPRINT');
    mk('ctxLeft', 'ctx', 'Yesterday&#39;s daily fingerprint');
    mk('ctxRight', 'ctx', 'User, Project, Time');
    mk('record', 'record', 'WorkSigned daily signed record');
    var converge = document.getElementById('converge');
    var converge2 = document.getElementById('converge2');

    // step 10: the chain-of-daily-signatures timeline (line + 7 day nodes)
    var DATES = ['Sep 24', 'Sep 25', 'Sep 26', 'Sep 27', 'Sep 28', 'Sep 29', 'Sep 30'];
    var tlNodes = [];
    (function(){
        var line = document.createElement('div');
        line.id = 'tl-line';
        zoomable.appendChild(line);
        window.__tlLine = line;
        for (var d = 0; d < 7; d++){
            var n = document.createElement('div');
            n.className = 'tlnode';
            n.innerHTML = '<div class="date">' + DATES[d] + '</div>';
            zoomable.appendChild(n);
            tlNodes.push(n);
        }
    })();

    // ---- geometry: everything derived from stage size + N ----
    var G;
    // Theme-aware glow: a cyan halo reads as a soft shadow on dark; on a light
    // page the same cyan is low-contrast, so use a deeper cyan so the pulse is
    // still visible. Read live at build time (theme is set on <html> pre-paint).
    function isLight(){
        return document.documentElement.getAttribute('data-theme') === 'light';
    }
    function cyanGlow(a){
        return isLight() ? ('0 0 28px rgba(8,145,178,' + a + ')') : ('0 0 28px rgba(34,211,238,' + a + ')');
    }
    function computeG(){
        var W = stage.clientWidth, H = stage.clientHeight;
        var catW = Math.min(132, (W - 100) / 5 - 14);
        var hashW = Math.min(150, (W - 90) / 5 - 12);
        var gap = 14, hgap = 12;
        var catX = [], hashX = [];
        for (var i = 0; i < 5; i++){
            catX.push((W - (5 * catW + 4 * gap)) / 2 + i * (catW + gap));
            hashX.push((W - (5 * hashW + 4 * hgap)) / 2 + i * (hashW + hgap));
        }
        return {
            catW: catW, hashW: hashW,
            // true vertical center of the stage: top of a BOX_H card centered
            midY: H / 2 - 26,
            catY0: H / 2 - 26,  // step 1: cats spawn at the vertical center
            catY1: H * 0.08,    // step 2/3: near top
            hashY: H / 2 - 26,  // row 2: spawns at the vertical center
            // row 2 shifted up under the blue row (step 4): the gap shrinks from
            // ~114px to ~32px, so the arrows shorten ~5x to a short stub while
            // the rows stay tight. Blue row remains in view.
            hashY2: H * 0.08 + 52 + 32,
            // step 5: the single root-hash card, at the vertical center
            rootW: 230,
            rootY: H / 2 - 26,   // same vertical center as the other card sets
            // step 7: two context cards, same size as the root card, one each side
            ctxW: 200,
            ctxY: H / 2 - 26,
            ctxGap: 24,          // gap between the root card edge and each ctx edge
            // x positions: root card centered; ctx cards flank it with ctxGap
            rootLeft: (W - 200) / 2,
            ctxLeftX: (W - 200) / 2 - 24 - 200,   // left ctx card left edge
            ctxRightX: (W - 200) / 2 + 200 + 24,  // right ctx card left edge
            ctxCenterX: (W - 200) / 2,            // center spawn (under the root)
            // step 8: the 3 cards shift up; the record card spawns at center
            ctxY2: H * 0.08,                       // 3 cards shift up to near top
            recW: 240,
            recY: H / 2 - 26,                      // record card at vertical center
            // step 10: horizontal timeline of 7 daily nodes, centered vertically
            tlY: H / 2,                            // vertical center of the nodes
            tlNode: 44,                            // node diameter
            tlSpan: W * 0.86,                      // total width the nodes span
            catX: catX, hashX: hashX,
            BOX_H: 52
        };
    }

    // ---- one timeline (built in build()), labels mark each step boundary ----
    var tl = gsap.timeline({ paused: true, delay: 0.05 });
    var CAP = 'power2.inOut'; // matches the old cubic-bezier(.45,.05,.2,1) feel
    var HOLD = 2.4; // seconds to rest at each settled step (gives the caption reading time)
    var built = false;

    function build(){
        G = computeG();
        var i, ax, ay, ah;

        // Hidden start-states (set normally so they apply on load).
        for (i = 0; i < 5; i++){
            gsap.set(nodes['cat' + i].el, {
                top: G.catY0 - 150, left: G.catX[i], width: G.catW, height: G.BOX_H, opacity: 0
            });
            // reset hashes + arrows too (a rebuild must clear their inline state
            // from a previous run; CSS defaults are overridden by inline styles).
            gsap.set(nodes['hash' + i].el, {
                top: G.hashY, left: G.hashX[i], width: G.hashW, height: G.BOX_H, opacity: 0
            });
            // arrow: hidden by zero height; bar opacity restored to 1 (a previous
            // run's step-6 fade may have left it at 0 inline). Step 2 grows the
            // height to reveal the bar; the tip's opacity is faded in separately.
            gsap.set(nodes['arrow' + i].el, { top: G.hashY - 28, height: 0, opacity: 1 });
            gsap.set(nodes['arrow' + i].tip, { opacity: 0 });
        }
        // root hash starts fully hidden (display off) so it never shows before
        // step 5. display:none is deterministic on forward play AND back-seek.
        nodes['rootHash'].el.style.display = 'none';
        gsap.set(nodes['rootHash'].el, {
            top: G.midY, left: (stage.clientWidth - G.rootW) / 2,
            width: G.rootW, height: G.BOX_H, opacity: 0
        });
        // context cards hidden until step 7
        nodes['ctxLeft'].el.style.display = 'none';
        nodes['ctxRight'].el.style.display = 'none';
        gsap.set([nodes['ctxLeft'].el, nodes['ctxRight'].el], {
            top: G.ctxY, left: G.ctxCenterX, width: G.ctxW, height: G.BOX_H, opacity: 0
        });
        // record card hidden until step 8
        nodes['record'].el.style.display = 'none';
        gsap.set(nodes['record'].el, {
            top: G.recY, left: (stage.clientWidth - G.recW) / 2, width: G.recW, height: G.BOX_H, opacity: 0
        });
        // Arrows and hashes start hidden by CSS (scaleY(0) / opacity:0) and are
        // only positioned when their own step begins (tl.call below), so step 1
        // shows the cats alone with no leak of later steps' boxes.

        // --- STEP 1: cat row drop-fades in from 150px above center ---
        tl.addLabel('s1', 0);
        for (i = 0; i < 5; i++){
            tl.to(nodes['cat' + i].el,
                { top: G.catY0, opacity: 1, duration: 0.7, ease: 'power2.out' }, 0.14);
        }
        // rest at step 1 (longer than HOLD: the intro caption needs a full read)
        tl.to({}, { duration: 3.4 });

        // --- STEP 2: cat row glides up to the top; arrows draw downward ---
        tl.addLabel('s2');
        tl.call(function(){
            for (var j = 0; j < 5; j++){
                ax = G.catX[j] + G.catW / 2 - 1;
                ay = G.catY1 + G.BOX_H;
                ah = G.hashY - 12 - ay; // tip lands just below row-2 top edge
                // hidden start: zero height + hidden tip, so the bar grows and
                // its tip fades in together when the draw starts
                gsap.set(nodes['arrow' + j].el, { top: ay, left: ax, height: 0 });
                gsap.set(nodes['arrow' + j].tip, { opacity: 0 });
            }
        }, null, 's2');
        // Position the hash row's hidden start-state at the start of step 2 so
        // it drops in at the same time as the arrows (no leak during step 1).
        tl.call(function(){
            for (var j = 0; j < 5; j++){
                gsap.set(nodes['hash' + j].el, {
                    top: G.hashY - 150, left: G.hashX[j], width: G.hashW, height: G.BOX_H, opacity: 0
                });
            }
        }, null, 's2');
        for (i = 0; i < 5; i++){
            ax = G.catX[i] + G.catW / 2 - 1;
            ay = G.catY1 + G.BOX_H;
            // Label-relative positions: GSAP treats a bare number as an ABSOLUTE
            // timeline time, which would place these during step 1 and leak the
            // step-2 motion. 's2' / 's2+=n' anchor them to the step-2 label.
            tl.to(nodes['cat' + i].el, { top: G.catY1, duration: 0.9, ease: CAP }, 's2');
            // Arrows start only AFTER the cards have settled at the top (s2+0.9),
            // so they grow from the cards' bottom edge and never cross the row.
            // The arrow's top is exactly the card bottom, so it never intersects.
            tl.to(nodes['arrow' + i].el, { height: G.hashY - (G.catY1 + G.BOX_H), duration: 0.7, ease: 'power1.out' }, 's2+=0.9');
            tl.to(nodes['arrow' + i].tip, { opacity: 1, duration: 0.1 }, 's2+=0.9');
            tl.to(nodes['hash' + i].el, { top: G.hashY, opacity: 1, duration: 0.7, ease: 'power2.out' }, 's2+=0.9');
        }
        tl.to({}, { duration: HOLD });

        // --- STEP 3: settled end of the 1->2->3 flow. The ZOOM (into the
        //     transcripts) is the step-3 content: it scales up, shows the chat
        //     cards, holds (with the transcript caption), then zooms out and
        //     flows straight into step 4. All on the master tl, so it stays in
        //     sync with the caption track and is seek-safe on rebuild. ---
        tl.addLabel('s3');
        var zoomSpan = addZoomSegment(tl, 's3+=0.3');
        // place s4 explicitly at the END of the zoom segment. (A compound
        // 's3+=0.3+X' is NOT valid GSAP position syntax, so sum the offset
        // into a single number.)
        tl.addLabel('s4', 's3+=' + (0.3 + zoomSpan));
        // make sure the root card is hidden for every step before 5 (display off
        // is deterministic on forward play AND back-seek, unlike an opacity tween)
        tl.call(function(){ nodes['rootHash'].el.style.display = 'none'; }, null, 's4');
        for (i = 0; i < 5; i++){
            tl.to(nodes['hash' + i].el, { top: G.hashY2, duration: 0.9, ease: CAP }, 's4');
            // arrows shorten to the new (smaller) gap between the rows
            tl.to(nodes['arrow' + i].el, {
                height: G.hashY2 - (G.catY1 + G.BOX_H), duration: 0.9, ease: CAP
            }, 's4');
        }
        tl.to({}, { duration: 0.5 });   // short gap before the root hash appears

        // build the convergence SVG FIRST so converge.paths exist before the
        // s5 tweens below reference them. Paths start hidden (dashoffset=full).
        drawConverge();

        // --- STEP 5: 5 curved lines converge from the green row into a single
        //     root-hash card. The root card drops in; the curves draw in. ---
        tl.addLabel('s5');
        tl.call(function(){
            // reveal the root card now (display on) + re-hide the convergence
            // curves (so a replay redraws them)
            var rw = G.rootW, rx = (stage.clientWidth - rw) / 2;
            var rh = nodes['rootHash'].el;
            rh.style.display = 'flex';
            gsap.set(rh, { top: G.midY, left: rx, width: rw, height: G.BOX_H, opacity: 0 });
            hideConverge();
        }, null, 's5');
        for (i = 0; i < 5; i++){
            tl.to(nodes['rootHash'].el,
                { top: G.rootY, opacity: 1, duration: 0.45, ease: 'power2.out' }, 's5+=0.1');
        }
        // draw the 5 curves in (after the root card lands), converging into the
        // top of the root card. No separate arrowhead (the convergence itself
        // reads as the single arrow).
        for (i = 0; i < 5; i++){
            tl.to(converge.paths[i],
                { strokeDashoffset: 0, duration: 0.5, ease: 'power1.inOut' }, 's5+=0.5');
        }
        tl.to({}, { duration: HOLD });

        // --- STEP 6: everything fades away except the root hash card ---
        tl.addLabel('s6');
        for (i = 0; i < 5; i++){
            tl.to(nodes['cat' + i].el, { opacity: 0, scale: 0.85, duration: 0.5, ease: 'power1.in' }, 's6');
            tl.to(nodes['hash' + i].el, { opacity: 0, scale: 0.85, duration: 0.5, ease: 'power1.in' }, 's6');
            tl.to(nodes['arrow' + i].el, { opacity: 0, duration: 0.35, ease: 'power1.in' }, 's6');
            tl.to(nodes['arrow' + i].tip, { opacity: 0, duration: 0.35 }, 's6');
            tl.to(converge.paths[i], { opacity: 0, duration: 0.4, ease: 'power1.in' }, 's6+=0.1');
        }
        tl.to({}, { duration: HOLD });

        // --- STEP 7: two context cards slide out from center to either side ---
        // re-hide the record card + its lines when arriving before s8 (back-seek
        // from step 8), so they don't leak into step 7 or earlier
        tl.call(function(){
            nodes['record'].el.style.display = 'none';
            hideConverge2();
        }, null, 's7');
        tl.addLabel('s7');
        tl.call(function(){
            // reveal + park both ctx cards at the center (hidden) so they can
            // slide out; display on is deterministic on forward play & back-seek
            ['ctxLeft', 'ctxRight'].forEach(function(id){
                var el = nodes[id].el;
                el.style.display = 'flex';
                gsap.set(el, { top: G.ctxY, left: G.ctxCenterX, width: G.ctxW, height: G.BOX_H, opacity: 0 });
            });
        }, null, 's7');
        tl.to(nodes['ctxLeft'].el,  { left: G.ctxLeftX,  opacity: 1, duration: 0.45, ease: 'power2.out' }, 's7+=0.1');
        tl.to(nodes['ctxRight'].el, { left: G.ctxRightX, opacity: 1, duration: 0.45, ease: 'power2.out' }, 's7+=0.1');
        tl.to({}, { duration: HOLD });

        // build the 3->record convergence SVG (paths must exist before the tweens)
        drawConverge2();

        // --- STEP 8: 3 cards shift up; record card spawns at center; lines draw ---
        tl.addLabel('s8');
        // shift the 3 cards up smoothly (like step 4)
        tl.to(nodes['ctxLeft'].el,  { top: G.ctxY2, duration: 0.5, ease: CAP }, 's8');
        tl.to(nodes['rootHash'].el, { top: G.ctxY2, duration: 0.5, ease: CAP }, 's8');
        tl.to(nodes['ctxRight'].el, { top: G.ctxY2, duration: 0.5, ease: CAP }, 's8');
        // after the shift, reveal the record card at center + draw the 3 lines
        tl.call(function(){
            var rec = nodes['record'].el;
            rec.style.display = 'flex';
            gsap.set(rec, { top: G.recY, left: (stage.clientWidth - G.recW) / 2, width: G.recW, height: G.BOX_H });
            hideConverge2();
        }, null, 's8+=0.5');
        // fromTo (not to) so the spawn is seek-safe: it always animates 0->1
        // regardless of any stale inline opacity a rebuild/resize left behind.
        tl.fromTo(nodes['record'].el, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 's8+=0.5');
        for (var j = 0; j < converge2.paths.length; j++){
            tl.to(converge2.paths[j], { strokeDashoffset: 0, duration: 0.5, ease: 'power1.inOut' }, 's8+=0.8');
        }
        tl.to({}, { duration: HOLD });

        // --- STEP 9: everything fades away except the daily record card ---
        tl.addLabel('s9');
        tl.to(nodes['ctxLeft'].el,  { opacity: 0, scale: 0.85, duration: 0.5, ease: 'power1.in' }, 's9');
        tl.to(nodes['rootHash'].el, { opacity: 0, scale: 0.85, duration: 0.5, ease: 'power1.in' }, 's9');
        tl.to(nodes['ctxRight'].el, { opacity: 0, scale: 0.85, duration: 0.5, ease: 'power1.in' }, 's9');
        for (var j = 0; j < converge2.paths.length; j++){
            tl.to(converge2.paths[j], { opacity: 0, duration: 0.4, ease: 'power1.in' }, 's9+=0.1');
        }
        tl.to({}, { duration: HOLD });

        // --- STEP 10: the record card first collapses into a plain circle at
        //     center, THEN the timeline fades in around it (it becomes the
        //     highlighted "today" node in the chain of daily signatures).
        tl.addLabel('s10');
        tl.call(function(){ positionTimeline(); }, null, 's10');
        // PHASE 1: the record card collapses into a solid circle (no timeline yet).
        // It shrinks to the node size and morphs to a circle, text hidden.
        tl.to(nodes['record'].el, {
            width: G.tlNode, height: G.tlNode, top: G.tlY - G.tlNode / 2,
            left: (stage.clientWidth / 2) - G.tlNode / 2, opacity: 1, scale: 1,
            fontSize: 0, borderRadius: '50%',
            background: '#22d3ee', border: 'none', z: 5,
            boxShadow: cyanGlow(0.6),
            duration: 0.75, ease: 'power2.inOut'
        }, 's10+=0.15');
        // PHASE 2: after the collapse, the timeline fades in (line + nodes).
        tl.to(window.__tlLine, { opacity: 0.7, duration: 0.75, ease: 'power1.out' }, 's10+=1.0');
        for (var d = 0; d < 7; d++){
            tl.to(tlNodes[d], { opacity: 1, duration: 0.7, ease: 'power1.out' }, 's10+=1.05 + ' + Math.abs(d - 3) * 0.1);
        }
        // PHASE 3: pulsating glow on the "today" node (the collapsed card).
        // Started as a STANDALONE tween (not in tl) via a call, because an
        // infinite tween inside the timeline makes its duration effectively
        // infinite, which breaks tl.seek('end') / the dock on replay. The call
        // fires only on forward play into step 10; rebuild() kills the tween.
        tl.call(function(){
            if (window.__pulse) window.__pulse.kill();
            window.__pulse = gsap.to(nodes['record'].el, {
                boxShadow: cyanGlow(0.95),
                scale: 1.12, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: -1
            });
        }, null, 's10+=2.0');
        tl.to({}, { duration: HOLD });

        // ---- CAPTION TRACK (independent of scene logic, same clock) ----
        // Each step's caption fades in near the start of its step and stays
        // until the next caption replaces it. Step 3 is blank (the zoom's
        // transcript caption, added in addZoomSegment, owns that window). This
        // is what disassociates captions from the scene: screen time is explicit
        // and nothing can flash for <1s just because a scene beat overwrote it.
        // 0.15s offset = caption lands just as the step's motion begins.
        for (var c = 1; c <= N; c++){
            addCaption(tl, 's' + c + '+=0.15', CAPTIONS[c - 1], 0.9);
        }

        // Continuous play: no per-boundary pause-calls. The whole 10-step
        // sequence (including the zoom segment) runs as one GSAP timeline, so
        // captions, zoom, and scene motion stay in sync by construction.
        tl.addLabel('end');
    }

    // Rebuild the timeline from the CURRENT stage size. Geometry (G) is computed
    // inside build(), so a stale size (resize / tab-return) is the source of
    // every distortion. We reassign tl (a fresh timeline) and re-run build(),
    // then restore the current step. DOM nodes persist (created once at load).
    function rebuild(){
        var wasBuilt = built;
        var resumeAt = (tl && wasBuilt) ? tl.time() : 0;   // where the playhead was
        var wasPlaying = !!(tl && tl.isActive() && !tl.paused());
        if (tl) tl.kill();
        tl = gsap.timeline({ paused: true, delay: 0.05 });
        built = false;
        ensureBuilt();
        built = true;
        lastStageW = stageWidth();
        // Kill any leftover inline state from a previous run that build() does not
        // reset: the infinite step-10 pulse on the record card, the record card's
        // step-10 morph (bg/border/fontSize/borderRadius), and the timeline line
        // + 7 day nodes (opacity). Without this, replay/resize leaves step-10
        // debris on screen.
        gsap.killTweensOf(nodes['record'].el);
        if (window.__pulse){ window.__pulse.kill(); window.__pulse = null; }
        gsap.set(nodes['record'].el, {
            fontSize: 13, borderRadius: '10px', background: 'rgba(8,51,68,0.5)',
            border: '1px solid rgba(103,232,249,0.35)', z: 'auto',
            boxShadow: '0 0 12px rgba(34,211,238,0.25)'
        });
        gsap.set(window.__tlLine, { opacity: 0 });
        for (var d = 0; d < tlNodes.length; d++) gsap.set(tlNodes[d], { opacity: 0 });
        if (wasBuilt && resumeAt > 0){
            // continuous timeline: restore to the SAME playhead time on the
            // fresh timeline, re-show the caption for that moment (tl.call
            // captions don't re-fire on seek), and resume playing.
            var t = Math.min(resumeAt, tl.duration() - 0.01);
            tl.seek(t);
            var cap = captionAtTime(t);
            if (cap){ showCaption(cap, 0.2); } else { gsap.to(capEl, { opacity: 0, duration: 0.2 }); }
            if (wasPlaying) tl.play();
        }
    }

    function hideConverge(){
        for (var j = 0; j < converge.paths.length; j++){
            var len = converge.paths[j].getTotalLength();
            converge.paths[j].style.strokeDasharray = len;
            converge.paths[j].style.strokeDashoffset = len;
        }
        if (converge.arrowTip) converge.arrowTip.style.opacity = 0;
    }

    function hideConverge2(){
        for (var j = 0; j < converge2.paths.length; j++){
            var len = converge2.paths[j].getTotalLength();
            converge2.paths[j].style.strokeDasharray = len;
            converge2.paths[j].style.strokeDashoffset = len;
        }
    }

    // Build the 3 curved paths from the (step-8 shifted-up) 3 cards' bottom
    // centers to the record card's top center. Called at build time.
    function drawConverge2(){
        var W = stage.clientWidth;
        converge2.setAttribute('viewBox', '0 0 ' + W + ' ' + stage.clientHeight);
        converge2.innerHTML = '';
        converge2.paths = [];
        var rx = W / 2;                     // record card top-center X
        var ry = G.recY;                    // record card top Y
        // the 3 cards' centers at their step-8 (ctxY2) position
        var xs = [G.ctxLeftX + G.ctxW / 2, W / 2, G.ctxRightX + G.ctxW / 2];
        var sy = G.ctxY2 + G.BOX_H;         // their bottom Y at step 8
        for (var j = 0; j < 3; j++){
            var sx = xs[j];
            var cxx = (sx + rx) / 2;
            var cyy = (sy + ry) / 2;
            var d = 'M ' + sx + ' ' + sy + ' Q ' + cxx + ' ' + cyy + ' ' + rx + ' ' + ry;
            var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', d);
            converge2.appendChild(p);
            var len = p.getTotalLength();
            p.style.strokeDasharray = len;
            p.style.strokeDashoffset = len;
            converge2.paths.push(p);
        }
    }

    // Position the step-10 timeline: a horizontal line + 7 day nodes spread
    // across the stage, centered. The center node (index 3) sits at stage center.
    function positionTimeline(){
        var W = stage.clientWidth;
        var step = G.tlSpan / 6;
        var line = window.__tlLine;
        line.style.top = (G.tlY - 1) + 'px';
        line.style.left = ((W - G.tlSpan) / 2) + 'px';
        line.style.width = G.tlSpan + 'px';
        for (var d = 0; d < 7; d++){
            var cx = (W / 2) + (d - 3) * step;
            var n = tlNodes[d];
            n.style.left = (cx - G.tlNode / 2) + 'px';
            n.style.top = (G.tlY - G.tlNode / 2) + 'px';
            n.style.width = G.tlNode + 'px';
            n.style.height = G.tlNode + 'px';
        }
    }

    // Build (or rebuild) the 5 curved convergence paths from each green card's
    // bottom-center to the root card's top-center, and set them up for a
    // stroke-draw (length 0 -> full). Called at the start of step 5.
    function drawConverge(){
        var W = stage.clientWidth;
        converge.setAttribute('viewBox', '0 0 ' + W + ' ' + stage.clientHeight);
        converge.innerHTML = '';
        var rx = (W - G.rootW) / 2 + G.rootW / 2;   // root card top-center X
        var ry = G.rootY;                          // root card top Y (converge point)
        converge.paths = [];
        for (var j = 0; j < 5; j++){
            var sx = G.hashX[j] + G.hashW / 2;      // green card bottom-center X
            var sy = G.hashY2 + G.BOX_H;            // green card bottom Y
            // control point pulls the curve inward as it descends
            var cxx = (sx + rx) / 2;
            var cyy = (sy + ry) / 2;
            var d = 'M ' + sx + ' ' + sy + ' Q ' + cxx + ' ' + cyy + ' ' + rx + ' ' + ry;
            var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', d);
            converge.appendChild(p);
            var len = p.getTotalLength();
            p.style.strokeDasharray = len;
            p.style.strokeDashoffset = len;   // hidden; GSAP animates to 0
            converge.paths.push(p);
        }
    }

    function ensureBuilt(){
        if (built) return;
        build();
        built = true;
    }
    var cur = 0;

    // The whole sequence is one continuous timeline. play() just lets it run
    // from wherever it currently is (start after a rebuild, or resume after a
    // seek). Captions + zoom + scene motion all live on tl, so they stay in sync.
    function play(){
        ensureBuilt();
        tl.play();
    }
    // Which caption should be visible at a given timeline time? Used by rebuild()
    // to restore the caption after a seek (tl.call captions don't re-fire on seek).
    function captionAtTime(t){
        // the zoom's transcript caption owns the s3 window
        var s3 = tl.labels['s3'], s4 = tl.labels['s4'];
        if (t >= s3 + 0.3 + 0.5 && t < s4){
            return 'Full AI transcripts are recorded: this clarifies the role AI took in your research.';
        }
        for (var c = 1; c <= N; c++){
            if (t >= tl.labels['s' + c] + 0.15){
                return CAPTIONS[c - 1];   // '' for step 3 (blank window)
            }
        }
        return CAPTIONS[0];
    }

    // buttons are gone in the video build; these are no-ops kept only so the
    // (absent) element refs don't throw. No-op.
    prevBtn.addEventListener('click', function(){ /* no-op */ });
    nextBtn.addEventListener('click', function(){ /* no-op */ });
    zoomBtn.addEventListener('click', function(){ /* no-op */ });
    replayBtn.addEventListener('click', function(){
        // full re-run: rebuild the timeline (pristine state) then play from 0.
        cur = 0;
        rebuild();
        tl.seek(0);
        play();
    });

    // Start on load: build the timeline from the rendered stage, then play the
    // whole continuous sequence.
    window.addEventListener('load', function(){
        setTimeout(function(){ lastStageW = stageWidth(); play(); }, 0);
    });

    // Rebuild the timeline when the stage resizes (or we return to the tab and
    // the size changed) so the baked geometry matches the real size. Debounced
    // so a drag-resize doesn't rebuild every frame. Only rebuilds when the
    // width actually changed, and only after the timeline has been built once.
    var lastStageW = 0;
    var resizeTimer = null;
    function stageWidth(){ return stage.clientWidth; }
    function onResize(){
        if (!built) return;
        if (stageWidth() === lastStageW) return;
        lastStageW = stageWidth();
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function(){ resizeTimer = null; rebuild(); }, 150);
    }
    window.addEventListener('resize', onResize);
    document.addEventListener('visibilitychange', function(){
        if (document.visibilityState === 'visible') onResize();
    });
})();
</script>
</body>
</html>
