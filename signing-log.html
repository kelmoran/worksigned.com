    <!-- Anti-flash: apply saved / system theme before first paint (no FOUC) -->
    <script>
    (function(){
        try {
            var t = localStorage.getItem('ws-theme');
            if (t !== 'light' && t !== 'dark' && t !== 'auto') {
                t = 'auto';
            }
            // 'auto' (or no value) -> follow the OS; explicit light/dark -> honor it
            var eff = (t === 'auto' || !t) ?
                ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light')
                : t;
            if (eff === 'dark') document.documentElement.setAttribute('data-theme','dark');
        } catch(e) {}
    })();
    </script>
