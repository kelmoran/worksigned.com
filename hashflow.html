<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How WorkSigned creates resilient proofs of research work.</title>
<script>
// Pick the theme BEFORE first paint (no flash). Priority:
//   1. ?theme=light|dark  (set by the parent page, e.g. web/index.html)
//   2. prefers-color-scheme (OS default)
// Then swap in the matching video and mark <html data-theme=...> so CSS applies.
(function(){
  var t = 'dark';
  try {
    var m = location.search.match(/[?&]theme=(light|dark)\b/);
    if (m) t = m[1];
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
  } catch(e){}
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  /* Dark (default) */
  html[data-theme="dark"] { color-scheme: dark; }
  html[data-theme="dark"] body { background: #0a0e13; color: #e2e8f0; }
  html[data-theme="dark"] .frame { border: 1px solid #263243; background: #0f1420; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  html[data-theme="dark"] video { background: #0f1420; }

  /* Light */
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="light"] body { background: #f4f6fa; color: #0f172a; }
  html[data-theme="light"] .frame { border: 1px solid #d5dce8; background: #ffffff; box-shadow: 0 16px 48px rgba(15,23,42,.12); }
  html[data-theme="light"] video { background: #ffffff; }

  html, body { margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; box-sizing: border-box; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 20px; letter-spacing: .2px; }
  .frame { width: 100%; max-width: 800px; border-radius: 14px; overflow: hidden; }
  video { display: block; width: 100%; height: auto; aspect-ratio: 1280 / 800; }
</style>
</head>
<body>
  <h1>How WorkSigned creates resilient proofs of research work.</h1>
  <div class="frame">
    <video id="vid" autoplay muted loop playsinline controls></video>
  </div>
  <script>
    // Load the video that matches the theme set on <html> (done above).
    document.getElementById('vid').src =
      (document.documentElement.getAttribute('data-theme') === 'light')
        ? 'hashflow-light.mp4' : 'hashflow.mp4';
  </script>
</body>
</html>
